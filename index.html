<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestor de Veículos</title>
<meta name="description" content="Controle suas corridas de aplicativo, quilometragem e finanças em um só lugar.">

<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestor de Veículos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Define o tema antes da tela aparecer, para não piscar branco no modo escuro -->
<script>
(function () {
  var tema = null;
  try { tema = localStorage.getItem("tema"); } catch (e) {}
  if (tema !== "dark" && tema !== "light") {
    tema = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", tema);
})();
</script>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/styles.css">

</head>
<body>

<div class="app-container">

  <header class="app-header">
    <h1 id="page-title">Início</h1>

    <div class="header-actions">
      <button id="installBtn" class="btn-install" type="button" hidden>Instalar app</button>

      <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-checked="false"
              aria-label="Modo escuro" title="Alternar modo claro/escuro">
        <span class="knob">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="#6c4cff" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </span>
      </button>

      <button id="logoutBtn" class="btn-logout" type="button" style="display:none">Sair</button>
    </div>
  </header>

  <main id="app" class="app-content"></main>

  <nav class="bottom-nav">
    <button data-page="dashboard">Início</button>
    <button data-page="veiculos">Veículos</button>
    <button data-page="corridas">Corridas</button>
    <button data-page="manutencao">Manutenção</button>
    <button data-page="combustivel">Combustível</button>
  </nav>

</div>

<script type="module" src="js/app.js"></script>
</body>

</html>
